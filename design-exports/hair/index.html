<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hair — Lottie fit surface</title>
<style>
  html, body { margin: 0; background: #0E0802; font-family: system-ui, sans-serif; color: #f5e6c8; }
  .wrap { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: #1a1008; border-radius: 16px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  #stage svg, #lottie svg { display: block; }
  #stage svg { width: 360px; height: auto; }
  #lottie { position: relative; width: 320px; height: 320px; }
  #lottie svg.hair { position: absolute; inset: 0; width: 100%; height: 100%; }
  #lottie svg.head { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; }
  .note { max-width: 360px; font-size: 13px; line-height: 1.5; opacity: 0.75; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>Export artboard (1100×1400)</h2>
    <div id="stage"></div>
  </div>
  <div class="panel">
    <h2>Lottie 100×100 fit (hair + head guide)</h2>
    <div id="lottie"></div>
    <p class="note">
      Face opening should clear eyes (~y50) and smile (~y62).
      Side falls sit on side tufts (~x18–24 / 76–82).
      Crown covers top fluff lobes (~y22–32).
    </p>
  </div>
</div>
<script src="hair.js"></script>
<script>
  document.getElementById('stage').innerHTML = window.buildHairSVG({ glow: true });

  /* Head guide matches LottieBuddy proportions */
  const guide = `
<svg class="head" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="50" cy="54" rx="31" ry="28.5" fill="none" stroke="#a98bff" stroke-width="0.6" stroke-dasharray="2 1.5"/>
  <ellipse cx="50" cy="54" rx="24.5" ry="22.5" fill="none" stroke="#7ee8ff" stroke-width="0.5" opacity="0.8"/>
  <ellipse cx="40" cy="50" rx="6.7" ry="7.8" fill="#fff" opacity="0.35"/>
  <ellipse cx="60" cy="50" rx="6.7" ry="7.8" fill="#fff" opacity="0.35"/>
  <circle cx="40" cy="50.6" r="5.3" fill="#5B3CE4" opacity="0.5"/>
  <circle cx="60" cy="50.6" r="5.3" fill="#5B3CE4" opacity="0.5"/>
  <path d="M43 61.5 Q50 65 57 61.5" fill="none" stroke="#3A2860" stroke-width="1" opacity="0.6"/>
  <ellipse cx="20" cy="52" rx="9" ry="12" fill="none" stroke="#c4d0ff" stroke-width="0.5" stroke-dasharray="1.5 1"/>
  <ellipse cx="80" cy="52" rx="9" ry="12" fill="none" stroke="#c4d0ff" stroke-width="0.5" stroke-dasharray="1.5 1"/>
  <ellipse cx="50" cy="26" rx="13" ry="11" fill="none" stroke="#fff6d0" stroke-width="0.5" stroke-dasharray="1.5 1"/>
</svg>`;

  document.getElementById('lottie').innerHTML =
    guide + window.buildHairSVG({ format: 'lottie', glow: false }).replace('<svg', '<svg class="hair"');
</script>
</body>
</html>
